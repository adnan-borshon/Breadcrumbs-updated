server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: deep links like /record/:id and /explorer must reach index.html
    # rather than 404, since a copied verification link has to open for anyone.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, so the browser never needs CORS and the client's relative
    # "/api" base path works unchanged from development.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
